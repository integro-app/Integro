name: Validar e publicar Integro
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar backend, regras e interface em producao'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run verify
  publicar:
    if: github.event_name == 'workflow_dispatch' && inputs.publicar == true
    needs: validar
    environment: production
    concurrency:
      group: integro-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/integro-firebase-deploy.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Preparar credencial temporaria
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}
        run: |
          python3 - <<'PY'
          import os, pathlib, json
          value = os.environ['FIREBASE_SERVICE_ACCOUNT_JSON']
          json.loads(value)
          target = pathlib.Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS'])
          target.write_text(value)
          target.chmod(0o600)
          PY
      - name: Publicar backend antes dos clientes
        run: npx firebase deploy --only functions --project integro-novo --non-interactive
      - name: Publicar regras
        run: npx firebase deploy --only firestore:rules,storage --project integro-novo --non-interactive
      - name: Publicar interface
        run: npx firebase deploy --only hosting --project integro-novo --non-interactive
      - name: Remover credencial temporaria
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          pathlib.Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS']).unlink(missing_ok=True)
          PY
