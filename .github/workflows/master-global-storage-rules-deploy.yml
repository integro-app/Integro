name: Deploy Firebase Storage - tenant block flag
on:
  push:
    branches: [main]
    paths:
      - "storage.rules"
      - ".github/workflows/master-global-storage-rules-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integro-storage-security-rules
  cancel-in-progress: false
jobs:
  validar_publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar aplicação e testes antes de publicar Rules
        run: npm run verify
      - name: Homologar Firestore e Storage no emulador
        run: npm run test:rules
      - name: Autenticar Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}
      - name: Publicar regras de Storage com bloqueio de tenant
        run: npx firebase deploy --only storage --project integro-novo --non-interactive
