name: Validar Vendas hoje + busca dinamica (temporario)
on:
  push:
    branches: [fix/vendedor-vendas-hoje-busca-dinamica-20261112]
    paths:
      - ".github/workflows/vendedor-vendas-dia-validar-temp.yml"
      - "tests/vendedor-vendas-dia-live.test.js"
      - "tests/sidebar-navigation-regression.test.js"
      - "tests/vendedor-operacao-consolidada.test.js"
permissions:
  contents: read
jobs:
  validar_vendas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes direcionados da tela Vendas e busca mobile
        run: node --test tests/vendedor-vendas-dia-live.test.js tests/vendedor-filtros-operacao.test.js tests/vendedor-unificado-operacao.test.js tests/mobile-shell.test.js
      - name: Suite completa, HTML, Hosting e sintaxe
        run: npm run verify
