name: Deploy backend seguro de Clientes (endpoint existente)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clientes-functions-deploy.yml"
      - "functions/v27-client-operations.js"
      - "functions/index.js"
      - "tests/clientes-backend.test.js"
      - "js/services/clientes-service.js"
permissions:
  contents: read
concurrency:
  group: integro-clientes-functions
  cancel-in-progress: false
jobs:
  verify_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Verify entire application, including client transactions
        run: npm run verify
      - name: Validate functions syntax
        run: node --check functions/v27-client-operations.js
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}
      - name: Update existing transfer callable with authenticated client operations
        run: npx firebase deploy --only functions:transferirResponsabilidadeV27 --project integro-novo --non-interactive
