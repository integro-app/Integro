name: Deploy Firebase - Master Global onboarding
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/master-global-functions-deploy.yml"
      - "functions/master-global-onboarding.js"
      - "functions/master-global-management.js"
      - "functions/index.js"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integro-master-global-functions
  cancel-in-progress: false
jobs:
  validar_publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Validar aplicação e regras antes de publicar
        run: npm run verify
      - name: Confirmar testes de onboarding
        run: node --test tests/master-global-onboarding.test.js
      - name: Autenticar no Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}
      - name: Publicar onboarding na Callable existente com IAM aprovado
        run: npx firebase deploy --only functions:solicitarCadastroDuplicadoV27 --project integro-novo --non-interactive
      - name: Atualizar proteção da callable existente de provisionamento
        run: npx firebase deploy --only functions:provisionarUsuario --project integro-novo --non-interactive
