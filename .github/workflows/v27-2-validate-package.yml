name: v27.2 validate and package

on:
  push:
    branches:
      - agent/v27.2-consolidacao
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Full test suite
        run: npm test

      - name: V27.2 consolidation tests
        run: npm run test:v27.2

      - name: JavaScript syntax
        run: npm run test:js

      - name: HTML integrity
        run: npm run test:html

      - name: Inline scripts
        run: npm run test:inline

      - name: Hosting surface
        run: npm run test:hosting

      - name: Functions syntax
        run: npm run test:functions:syntax

      - name: Firestore and Storage rules
        run: npm run test:rules

      - name: Build V27.2 package
        shell: bash
        run: |
          mkdir -p dist
          zip -r dist/Integro-V27.2-Consolidacao-20260817.zip . \
            -x '.git/*' 'node_modules/*' '.firebase/*' 'dist/*' '*.log'
          sha256sum dist/Integro-V27.2-Consolidacao-20260817.zip > dist/Integro-V27.2-Consolidacao-20260817.sha256

      - name: Upload V27.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Integro-V27.2-Consolidacao-20260817
          path: |
            dist/Integro-V27.2-Consolidacao-20260817.zip
            dist/Integro-V27.2-Consolidacao-20260817.sha256
          retention-days: 14
