name: Diagnose Clientes tenant visibility (read only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-clientes-tenant.yml"
      - "scripts/diagnose-clientes-tenant-readonly.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefix functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}
      - name: Inspect account tenancy and counts without exporting customer data
        env:
          INTEGRO_DIAGNOSTIC_EMAIL: gu@ar.com
        run: node scripts/diagnose-clientes-tenant-readonly.cjs
