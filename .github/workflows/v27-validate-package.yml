name: v27 validate and package

on:
  push:
    branches:
      - agent/v27-fluxos-integrados
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: V27 focused tests
        run: npm run test:v27

      - name: JavaScript syntax
        run: npm run test:js

      - name: HTML integrity
        run: npm run test:html

      - name: Functions syntax
        run: npm run test:functions:syntax

      - name: Build homologation package
        shell: bash
        run: |
          mkdir -p dist
          zip -r dist/Integro-V27-Homologacao-20260816.zip . \
            -x '.git/*' 'node_modules/*' '.firebase/*' 'dist/*' '*.log'
          sha256sum dist/Integro-V27-Homologacao-20260816.zip > dist/Integro-V27-Homologacao-20260816.sha256

      - name: Upload V27 homologation artifact
        uses: actions/upload-artifact@v4
        with:
          name: Integro-V27-Homologacao-20260816
          path: |
            dist/Integro-V27-Homologacao-20260816.zip
            dist/Integro-V27-Homologacao-20260816.sha256
          retention-days: 14
