name: Auditoria M22 - cinco vendas de fechamento (somente leitura)
on:
  push:
    branches:
      - audit/m22-cinco-vendas-20261120
    paths:
      - "scripts/diagnostico-m22-cinco-vendas.cjs"
      - ".github/workflows/diagnostico-m22-cinco-vendas.yml"
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix functions ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}
      - name: Ler cinco documentos e vinculos (sem mutacao)
        run: node scripts/diagnostico-m22-cinco-vendas.cjs
