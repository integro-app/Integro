name: Deploy seguro - Módulo Vendas
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendas-functions-deploy.yml"
      - "functions/financial-callables.js"
      - "functions/seller-collection-corrections.js"
      - "functions/index.js"
      - "tests/vendedor-corrigir-baixa.test.js"
      - "js/perfis-unificados.js"
      - "tests/vendedor-unificado-operacao.test.js"
      - "js/services/vendedor-pagamento-flexivel.js"
      - "js/services/vendedor-cobranca-correcoes.js"
      - "js/services/vendedor-fechamento-caixa.js"
      - "tests/vendedor-unificado-operacao.test.js"
      - "functions/v27-sales-approvals.js"
      - "functions/v27-sales-cancellation.js"
      - "tests/vendas-cancelamento-emulator.integration.test.js"
      - "tests/vendas-aprovacoes-emulator.integration.test.js"
      - "functions/financial-core.js"
      - "tests/vendas-emulator.integration.test.js"
      - "tests/performance-optimization.test.js"
      - "tests/vendedor-unificado-operacao.test.js"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integro-vendas-functions-deploy
  cancel-in-progress: false
jobs:
  validar_publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Verificar aplicação e regras existentes
        run: npm run verify
      - name: Confirmar a criação e renovação de vendas no emulador isolado
        run: npx --yes firebase-tools@latest emulators:exec --only auth,firestore,storage --project integro-novo "node scripts/seed-homologacao-clientes.js && node --test --test-concurrency=1 tests/vendas-emulator.integration.test.js tests/vendas-aprovacoes-emulator.integration.test.js tests/vendas-cancelamento-emulator.integration.test.js"
      - name: Autenticar com conta de serviço já configurada
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}
      - name: Selecionar endpoints que realmente mudaram
        id: endpoints
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "vendas=true" >> "$GITHUB_OUTPUT"
            echo "correcoes=true" >> "$GITHUB_OUTPUT"
          else
            alterados="$(git diff --name-only HEAD^ HEAD)"
            if echo "$alterados" | grep -Eq '^functions/(index|financial-callables|financial-core|v27-sales-approvals|v27-sales-cancellation)[.]js'; then
              echo "vendas=true" >> "$GITHUB_OUTPUT"
            fi
            if echo "$alterados" | grep -Eq '^functions/(index|seller-collection-corrections|financial-core)[.]js'; then
              echo "correcoes=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Publicar endpoints financeiros de Vendas
        if: steps.endpoints.outputs.vendas == 'true'
        run: npx firebase deploy --only functions:registrarVendaOperacional,functions:registrarPagamentoOperacional,functions:registrarNaoPagamentoOperacional,functions:decidirVendaComSaldoV27 --project integro-novo --non-interactive
      - name: Publicar apenas a correção de baixa
        if: steps.endpoints.outputs.correcoes == 'true'
        run: npx firebase deploy --only functions:corrigirBaixaCobrancaOperacional --project integro-novo --non-interactive
