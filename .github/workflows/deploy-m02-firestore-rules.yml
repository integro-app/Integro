name: Publicar M02 - isolamento de funcionarios no Firestore
on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "scripts/deploy-m02-firestore-rules-rest.mjs"
      - ".github/workflows/deploy-m02-firestore-rules.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-m02-firestore-rules
  cancel-in-progress: false
jobs:
  validar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        run: npm ci
      - name: Auditar codigo antes da publicacao
        run: npm run verify
      - name: Testar isolamento e regras no emulador
        run: npm run test:rules
      - name: Autenticar conta de servico aprovada
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}
      - name: Validar sintaxe do publicador
        run: node --check scripts/deploy-m02-firestore-rules-rest.mjs
      - name: Publicar apenas Firestore Rules pelo REST oficial
        run: node scripts/deploy-m02-firestore-rules-rest.mjs
