name: Deploy seguro de notificacoes de leads
on:
  push:
    branches: [main]
    paths:
      - "functions/v27-lead-notifications.js"
      - "functions/notification-core.js"
      - ".github/workflows/firebase-lead-notifications-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integro-lead-notifications-functions
  cancel-in-progress: false

jobs:
  verify_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run verify
      - name: Validar sintaxe da nova funcao
        run: node --check functions/v27-lead-notifications.js
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}
      - name: Publicar exclusivamente emissor seguro de leads
        run: npx firebase deploy --only functions:emitirNotificacaoLeadV27 --project integro-novo --non-interactive
