name: Deploy Firebase - ciclo de caixas

on:
  push:
    branches: [main]
    paths:
      - "functions/box-lifecycle.js"
      - "functions/box-reconciliation.js"
      - "tests/caixa-pendencias-rota-regression.test.js"
      - "functions/index.js"
      - "tests/vendas-emulator.integration.test.js"
      - ".github/workflows/firebase-caixas-functions-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integro-caixas-functions-deploy
  cancel-in-progress: false

jobs:
  validate_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run verify
      - name: Autenticar no Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}
      - name: Publicar ciclo transacional de caixas
        run: npx firebase deploy --only functions:abrirCaixaOperacional,functions:conferirCaixaOperacional,functions:fecharCaixaOperacional,functions:reabrirCaixaOperacional,functions:consultarDatasCaixaEquipe --project integro-novo --non-interactive
