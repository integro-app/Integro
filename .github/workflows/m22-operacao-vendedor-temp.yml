name: Validacao M22 Operacao Vendedor (temporaria)
on:
  push:
    branches:
      - fix/m22-operacao-vendedor-permissoes-abas-20261112
permissions:
  contents: read
jobs:
  m22:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regressao focada no vendedor, abas e mobile
        run: node --test tests/sidebar-navigation-regression.test.js tests/vendedor-unificado-operacao.test.js tests/mobile-shell.test.js tests/vendedor-operacao-cobrancas.test.js tests/vendedor-filtros-operacao.test.js
      - name: Verificacao geral de codigo e integridade
        run: npm run verify
