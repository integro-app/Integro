name: Deploy M01 - primeiro acesso e senha provisoria (retry de Rules)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-primeiro-acesso-m01.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-m01-primeiro-acesso
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependencias
        run: npm ci
      - name: Testar codigo, layout, autenticacao e regressao
        run: npm run verify
      - name: Testar Firestore Rules com emulador
        run: npm run test:rules
      - name: Instalar dependencias de Functions
        run: npm ci --prefix functions
      - name: Atualizar seguranca de acesso Firestore
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "Conta de servico Firebase indisponivel" >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SA_JSON" > "$RUNNER_TEMP/firebase-m01-first-access-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-m01-first-access-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-m01-first-access-sa.json"
          for tentativa in 1 2 3 4; do
            echo "Publicacao de Firestore Rules - tentativa $tentativa/4"
            if npx --yes firebase-tools@14.23.0 deploy --only firestore:rules --project integro-novo --non-interactive; then
              echo "Rules publicadas."
              break
            fi
            if [ "$tentativa" -eq 4 ]; then
              echo "Falha persistente ao publicar as Rules; Cloud Functions permanecem sem deploy." >&2
              exit 1
            fi
            sleep 20
          done
      - name: Publicar somente Functions de acesso inicial
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}
        run: |
          printf '%s' "$FIREBASE_SA_JSON" > "$RUNNER_TEMP/firebase-m01-first-access-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-m01-first-access-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-m01-first-access-sa.json"
          npx --yes firebase-tools@14.23.0 deploy --only functions:solicitarCadastroDuplicadoV27,functions:provisionarUsuario,functions:iniciarSessaoV27 --project integro-novo --non-interactive
