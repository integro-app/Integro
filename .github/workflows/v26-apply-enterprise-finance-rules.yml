name: v26 apply enterprise finance rules

on:
  push:
    branches:
      - agent/v26-controle-financeiro-empresarial
    paths:
      - .github/workflows/v26-apply-enterprise-finance-rules.yml
      - scripts/apply-enterprise-finance-rules-v26.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v26-controle-financeiro-empresarial
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply enterprise finance rules
        run: node scripts/apply-enterprise-finance-rules-v26.js
      - name: Validate markers
        run: node scripts/apply-enterprise-finance-rules-v26.js --check
      - name: Commit generated rules
        shell: bash
        run: |
          if git diff --quiet -- firestore.rules; then
            echo "Rules already updated"
            exit 0
          fi
          git config user.name "integro-v26-bot"
          git config user.email "integro-v26-bot@users.noreply.github.com"
          git add firestore.rules
          git commit -m "v26 aplica rules do controle financeiro empresarial"
          git push origin HEAD:agent/v26-controle-financeiro-empresarial
