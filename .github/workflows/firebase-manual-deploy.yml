name: Deploy ÍNTEGRO manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integro-novo-production-manual
  cancel-in-progress: false

jobs:
  validate_and_deploy:
    name: Validar e publicar correção do vendedor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar branch de trabalho
        uses: actions/checkout@v4
        with:
          ref: agent/produto-excelencia

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar projeto antes do deploy
        run: npm run verify

      - name: Autenticar no Google/Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRO_NOVO }}

      - name: Publicar Function de correção de baixas
        run: npx firebase-tools deploy --only functions:corrigirBaixaCobrancaOperacional --project integro-novo --non-interactive

      - name: Publicar Hosting
        run: npx firebase-tools deploy --only hosting --project integro-novo --non-interactive
